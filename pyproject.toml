[project]
name = "ai-interview-task"
version = "0.1.0"
description = "A dead simple in-memory data warehouse that ingests CSV files."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
